# Not best practices, it is recommended that profiles.yml go in ~/.dbt/

local_trino_connection:
  target: dev
  outputs:
    dev:
      type: trino
      host: "{{ env_var('TRINO_HOST', 'http://localhost') }}"
      database: iceberg
      schema: bronze
      port: 8080
      user: trino
      threads: 4
